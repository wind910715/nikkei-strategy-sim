name: Nikkei Strategy Backtest v2
on:
  workflow_dispatch:
  push:
    paths:
      - 'nikkei_backtest_v2.py'
      - '.github/workflows/nikkei-v2.yml'
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python nikkei_backtest_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: nikkei-backtest-v2
          path: results.json
