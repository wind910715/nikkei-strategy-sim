name: Nikkei Strategy Backtest
on:
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python nikkei_backtest.py
      - uses: actions/upload-artifact@v4
        with:
          name: nikkei-backtest
          path: results.json
